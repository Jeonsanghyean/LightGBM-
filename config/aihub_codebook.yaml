# AI-Hub 카드거래 합성데이터 코드표 (설계서 F2)
# 공식 페이지에는 열 이름과 예시값만 있고 코드의 의미는 없다. (2026-11-25 확인)
# 데이터 설명서를 받기 전까지는 모든 매핑을 비워 둔다 → 해당 공통 필드는 NULL, 원본 코드는 kr_extra에 그대로 보관.
# 설명서로 확인한 뒤에만 값을 채우고, verified를 true로 바꾼다.

verified: false

# 통합승인금액의 통화. 이름("통합")상 원화 환산액으로 보이나 설명서 확인 전이다.
# 공통 스키마에서 통화는 필수라 KRW로 두되, provenance에 'assumed'로 표시한다.
currency: KRW

# 가맹점광역시도코드 → 시도명. 예: "8": "경기"  (미확인이므로 비움)
region: {}

# 인터넷판매여부 → online/offline. 예: "1": online, "0": offline  (미확인이므로 비움)
internet_sale: {}

# 승인거래코드 → approved/cancelled. 예: "0": approved  (미확인이므로 비움)
approval_code: {}

# 국내해외여부 값 중 '국내'를 뜻하는 값 (공식 예시값 "국내"는 확인됨)
domestic_values: [국내]
overseas_values: [해외]

# 이상거래 여부 값 중 '이상'을 뜻하는 값 (공식 예시값 0 = 정상으로 보이나, 1 = 이상은 설명서로 확인 필요)
fraud_positive_values: ["1", "Y"]
fraud_negative_values: ["0", "N"]
